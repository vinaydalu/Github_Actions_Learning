name : Deployment Excerise
on: 
  push: 
    branches: [main,feature/**]

job:
  deploy: 
    runs-on: ubuntu-latest
    steps: 
      -name: Get Code
      uses: actions/checkout@v7
      -name: Install Dependencies
      run: npm ci
      -name: Lint
      run: npm run lint
      -name: Test Code
      run: npm run test
      -name: Build Code
      run: npm run build
      -name: Deploy Code
      run: echo "Deploying..."

