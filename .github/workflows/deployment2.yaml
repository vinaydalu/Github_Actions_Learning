name : Deployment Excerise
on: 
  push: 
    branches: [main,feature/**]


jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Test Code
        run: npm run test


  deploy: 
    runs-on: ubuntu-latest
    steps: 
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Deploy Code
        run: echo "Deploying..."

